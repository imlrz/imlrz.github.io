<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talks · Ruizhe Li</title>
  <style>
    :root {
      --forest: #245B56;
      --pale: #EDF4F1;
      --ink: #161A19;
      --muted: #5B6763;
      --line: #CFD8D4;
      --sans: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", sans-serif;
      --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: var(--ink);
      font-family: var(--sans);
      max-width: 860px;
      margin: 0 auto;
      padding: 84px 28px;
      line-height: 1.6;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1.5px solid var(--forest);
      padding-bottom: 12px;
      margin-bottom: 28px;
    }
    h1 { font-size: 28px; color: var(--forest); }
    header a { font-family: var(--mono); font-size: 13px; color: var(--muted); text-decoration: none; }
    header a:hover { color: var(--forest); }
    .list { border-top: 1.8px solid var(--ink); border-bottom: 1.8px solid var(--ink); }
    .item {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 20px 8px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }
    .item:hover { background: var(--pale); }
    .date { font-family: var(--mono); font-size: 14px; color: var(--forest); font-weight: 600; }
    .title b { display: block; font-size: 18px; margin-bottom: 3px; }
    .title span { font-size: 14px; color: var(--muted); }
    .title { color: inherit; text-decoration: none; }
    .title:hover b { color: var(--forest); }
    .item-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .go { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); font-family: var(--mono); font-size: 14px; color: var(--forest); text-decoration: none; white-space: nowrap; }
    .go:hover { background: var(--pale); border-color: var(--forest); }
    a:focus-visible { outline: 2px solid var(--forest); outline-offset: 4px; }
    @media (max-width: 640px) {
      body { padding: 48px 20px; }
      .item { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Talks</h1>
    <a href="/">← imlrz.github.io</a>
  </header>
  <div class="list">
    <article class="item">
      <span class="date">2026.11.18</span>
      <a class="title" href="./261118/">
        <b>Similarity ≠ Utility：智能体长期记忆系统与测试基准中的盲点</b>
        <span>EvoAgentX Invited Talk · Keep It InMind</span>
      </a>
      <nav class="item-links" aria-label="讲座资源">
        <a class="go" href="./261118/">Slides</a>
        <a class="go" href="https://www.bilibili.com/video/BV1CjsB6GEuc/" target="_blank" rel="noopener">视频 · Bilibili</a>
      </nav>
    </article>
  </div>
</body>
</html>
